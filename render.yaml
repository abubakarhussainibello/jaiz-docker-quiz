services:
  - type: web
    name: jaiz-docker-quiz
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: jaiz-quiz-db, property: connectionString }
      - key: ADMIN_KEY
        generateValue: true
databases:
  - name: jaiz-quiz-db
    plan: free
