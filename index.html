<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Quiz · QoreBox</title>
<meta name="description" content="Jaiz Microservices Training: test your Docker knowledge in 20 questions.">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root {
  --navy:#04204A; --navy2:#0B3D91; --deep:#020F26; --blue:#0573FF; --sky:#00AEFF; --indigo:#3F51D9;
  --ink:#0D1B33; --body:#33415C; --muted:#5B6880; --line:#DDE5F0; --tint:#EAF2FF; --tint2:#F4F8FF;
  --ok:#12B574; --ok2:#0F9D63; --okbg:#E6F7EF; --bad:#E5484D; --badbg:#FDECEC; --gold:#FFC94D;
  --head:"Plus Jakarta Sans","Inter",Arial,sans-serif; --sans:"Inter","Segoe UI",Arial,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body { font:16px/1.55 var(--sans); color:#fff; background:var(--deep); overflow-x:hidden; }
body::before { content:""; position:fixed; inset:0; z-index:-2;
  background: radial-gradient(900px 600px at 85% -10%, #0573FF55, transparent 60%), radial-gradient(800px 600px at -10% 110%, #3F51D955, transparent 60%), linear-gradient(160deg, #04204A, #020F26 70%); }
body::after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size:44px 44px;
  mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%); }
button { font:inherit; }
code { font:600 .88em var(--mono); background:#0573FF1a; color:#0B3D91; padding:1px 6px; border-radius:6px; }
.app { max-width:1180px; margin:0 auto; padding:18px 20px 40px; }
/* top bar */
.bar { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.bar img { height:26px; filter:brightness(0) invert(1); }
.bar .sep { width:1px; height:24px; background:#ffffff2e; }
.bar .ttl b { display:block; font:800 15px var(--head); letter-spacing:.01em; }
.bar .ttl small { color:#9FB9E8; font-size:12px; }
.bar .chips { margin-left:auto; display:flex; gap:8px; }
.chip { display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:99px; background:#ffffff10; border:1px solid #ffffff1f; font:700 13px var(--sans); color:#DCE7FF; }
.chip svg { width:15px; height:15px; }
.chip.pts b { color:var(--gold); }
.chip.fire { color:#FFB067; }
/* ---------- landing ---------- */
.land { display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center; min-height:calc(100vh - 140px); }
.eyebrow { display:inline-flex; align-items:center; gap:8px; font:700 12px var(--sans); letter-spacing:.16em; text-transform:uppercase; color:#9FD8FF; padding:6px 12px; border-radius:99px; background:#ffffff10; border:1px solid #ffffff1f; }
.eyebrow i { width:7px; height:7px; border-radius:50%; background:var(--sky); box-shadow:0 0 0 4px #00AEFF33; animation:pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity:.35; } }
.land h1 { font:800 clamp(38px,5.4vw,66px)/1.02 var(--head); letter-spacing:-.03em; margin:18px 0 14px; }
.land h1 span { background:linear-gradient(90deg,#7CD3FF,#00AEFF 40%,#0573FF); -webkit-background-clip:text; background-clip:text; color:transparent; }
.land p.lead { font-size:18px; color:#C9D8F5; max-width:52ch; margin:0 0 22px; }
.facts { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:26px; }
.fact { padding:10px 14px; border-radius:14px; background:#ffffff0d; border:1px solid #ffffff1c; }
.fact b { display:block; font:800 22px var(--head); line-height:1.1; }
.fact small { color:#9FB9E8; font-size:12.5px; }
.namebox { display:flex; gap:10px; max-width:560px; background:#ffffff10; border:1px solid #ffffff26; border-radius:18px; padding:8px; backdrop-filter:blur(8px); }
.namebox input { flex:1; min-width:0; font:600 17px var(--sans); color:#fff; background:transparent; border:0; outline:0; padding:10px 12px; }
.namebox input::placeholder { color:#8FA8D8; }
.namebox:focus-within { border-color:var(--sky); box-shadow:0 0 0 4px #00AEFF22; }
.go { border:0; border-radius:12px; padding:12px 20px; font:800 15px var(--head); cursor:pointer; color:var(--navy); background:linear-gradient(135deg,#FFE08A,var(--gold)); box-shadow:0 10px 26px -10px #FFC94Daa; display:inline-flex; align-items:center; gap:8px; transition:transform .12s, filter .15s; white-space:nowrap; }
.go:hover { filter:brightness(1.05); } .go:active { transform:translateY(1px); }
.go:disabled { filter:grayscale(.6) brightness(.8); cursor:not-allowed; box-shadow:none; }
.hint { color:#8FA8D8; font-size:13px; margin-top:10px; }
.path { position:relative; display:grid; gap:12px; }
.path::before { content:""; position:absolute; left:31px; top:30px; bottom:30px; width:2px; background:linear-gradient(#00AEFF,#3F51D9,#0B3D91); opacity:.6; }
.stop { position:relative; display:flex; gap:16px; align-items:center; padding:14px 16px; border-radius:18px; background:#ffffff0b; border:1px solid #ffffff1a; animation:rise .5s both; }
.stop:nth-child(2) { animation-delay:.08s; } .stop:nth-child(3) { animation-delay:.16s; } .stop:nth-child(4) { animation-delay:.24s; }
.stop .n { flex:none; width:32px; height:32px; border-radius:10px; display:grid; place-items:center; font:800 15px var(--head); background:var(--c); color:#fff; box-shadow:0 0 0 5px #020F26; z-index:1; }
.stop b { display:block; font:700 16px var(--head); }
.stop small { color:#9FB9E8; }
.stop .diff { margin-left:auto; display:flex; gap:3px; }
.stop .diff i { width:7px; height:16px; border-radius:3px; background:#ffffff22; }
.stop .diff i.on { background:var(--c); }
.boxes { height:150px; margin:0 0 14px 4px; }
@keyframes rise { from { opacity:0; transform:translateY(10px); } }
/* ---------- play ---------- */
.play { display:grid; grid-template-columns:290px 1fr; gap:22px; align-items:start; }
.rail { position:sticky; top:18px; background:#ffffff0b; border:1px solid #ffffff1a; border-radius:22px; padding:18px; backdrop-filter:blur(10px); }
.rail h3 { margin:0 0 12px; font:700 12px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#9FB9E8; }
.lvl { margin-bottom:14px; }
.lvl .t { display:flex; justify-content:space-between; align-items:center; font:700 13.5px var(--head); margin-bottom:7px; color:#DCE7FF; }
.lvl .t span { font:600 12px var(--sans); color:#8FA8D8; }
.lvl.cur .t { color:#fff; }
.dots { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.dot { height:10px; border-radius:6px; background:#ffffff1a; position:relative; }
.dot.ok { background:var(--ok); } .dot.no { background:var(--bad); }
.dot.now { background:var(--c); animation:pulse 1.2s infinite; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
.st { padding:10px 12px; border-radius:14px; background:#ffffff0d; }
.st b { display:block; font:800 22px var(--head); }
.st small { color:#9FB9E8; font-size:12px; }
.keys { margin-top:14px; font-size:12px; color:#8FA8D8; line-height:1.7; }
.keys kbd { font:600 11px var(--mono); padding:1px 6px; border-radius:5px; background:#ffffff14; border:1px solid #ffffff26; color:#DCE7FF; }
.qcard { background:#fff; color:var(--ink); border-radius:26px; overflow:hidden; box-shadow:0 30px 70px -35px #000c; animation:rise .35s both; }
.qhead { display:flex; align-items:center; gap:12px; padding:16px 26px; background:linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 70%, #04204A)); color:#fff; }
.qhead .lv { font:800 12px var(--sans); letter-spacing:.12em; text-transform:uppercase; }
.qhead .num { margin-left:auto; font:700 13px var(--sans); opacity:.9; }
.qhead .worth { font:800 12px var(--sans); padding:4px 10px; border-radius:99px; background:#ffffff26; }
.qbody { padding:26px clamp(18px,3vw,34px) 28px; }
.q { font:800 clamp(22px,2.6vw,29px)/1.28 var(--head); letter-spacing:-.01em; margin:0 0 16px; color:var(--ink); }
.q code { font-size:.82em; }
pre.code { font:500 14.5px/1.6 var(--mono); background:#04204A; color:#DCE7FF; padding:14px 18px; border-radius:14px; overflow-x:auto; margin:0 0 18px; border:1px solid #0B3D91; }
.opts { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
.opt { min-width:0; overflow-wrap:anywhere; }
.opt { position:relative; text-align:left; padding:16px 44px 16px 62px; min-height:76px; border-radius:16px; border:2px solid var(--line); background:var(--tint2); color:var(--ink); cursor:pointer; font:600 15.5px/1.4 var(--sans); transition:transform .12s, border-color .15s, background .15s, box-shadow .15s; display:flex; align-items:center; }
.opt:hover:not(:disabled) { transform:translateY(-2px); border-color:var(--c); background:#fff; box-shadow:0 12px 24px -16px #0B3D9166; }
.opt .L { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font:800 15px var(--head); color:#fff; background:var(--c); box-shadow:0 3px 0 color-mix(in srgb, var(--c) 60%, #000); }
.opt:disabled { cursor:default; }
.opt.right { border-color:var(--ok); background:var(--okbg); }
.opt.right .L { background:var(--ok2); box-shadow:0 3px 0 #0a6b44; }
.opt.wrong { border-color:var(--bad); background:var(--badbg); animation:shake .35s; }
.opt.wrong .L { background:var(--bad); box-shadow:0 3px 0 #a11e22; }
.opt.dim { opacity:.45; }
.opt .mk { position:absolute; right:12px; top:10px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:#fff; }
.opt.right .mk { background:var(--ok2); } .opt.wrong .mk { background:var(--bad); }
@keyframes shake { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
.why { display:flex; gap:14px; margin-top:18px; padding:16px 18px; border-radius:16px; background:var(--tint2); border:1px solid var(--line); animation:rise .3s both; }
.why .ic { flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; color:#fff; background:var(--ok2); }
.why.no .ic { background:var(--bad); }
.why h4 { margin:0 0 2px; font:800 16px var(--head); color:var(--ink); }
.why p { margin:0; color:var(--body); }
.foot { display:flex; align-items:center; gap:12px; margin-top:20px; }
.foot .tip { color:var(--muted); font-size:13px; }
.next { margin-left:auto; border:0; border-radius:14px; padding:13px 22px; font:800 15px var(--head); cursor:pointer; color:#fff; background:linear-gradient(135deg,var(--blue),var(--navy2)); box-shadow:0 12px 24px -12px #0573FF; display:inline-flex; align-items:center; gap:8px; }
.pop { position:fixed; z-index:20; font:800 30px var(--head); color:var(--gold); text-shadow:0 4px 18px #0008; pointer-events:none; animation:popup 1.1s ease-out forwards; }
@keyframes popup { 0% { opacity:0; transform:translateY(10px) scale(.7); } 20% { opacity:1; transform:translateY(0) scale(1.1); } 100% { opacity:0; transform:translateY(-60px) scale(1); } }
/* ---------- level up ---------- */
.levelup { text-align:center; padding:60px 20px; animation:rise .4s both; }
.medal { width:160px; height:160px; margin:0 auto 10px; }
.levelup h2 { font:800 clamp(34px,5vw,54px)/1.05 var(--head); margin:8px 0; }
.levelup p { color:#C9D8F5; font-size:18px; margin:0 0 26px; }
/* ---------- certificate ---------- */
.done { display:grid; grid-template-columns:1fr; gap:22px; max-width:900px; margin:0 auto; }
.cert { position:relative; background:#fff; color:var(--ink); border-radius:26px; padding:38px clamp(20px,5vw,56px) 34px; box-shadow:0 40px 80px -40px #000d; overflow:hidden; text-align:center; animation:rise .5s both; }
.cert::before { content:""; position:absolute; inset:12px; border:2px solid var(--tint); border-radius:18px; pointer-events:none; }
.cert::after { content:""; position:absolute; right:-80px; top:-80px; width:260px; height:260px; border-radius:50%; background:radial-gradient(#0573FF22, transparent 70%); }
.cert .logo { height:30px; }
.cert .k { margin-top:14px; font:800 12px var(--sans); letter-spacing:.24em; text-transform:uppercase; color:var(--blue); }
.cert .who { font:800 clamp(30px,4.6vw,48px)/1.1 var(--head); letter-spacing:-.02em; margin:8px 0 2px; color:var(--navy); }
.cert .what { color:var(--muted); margin:0 0 18px; }
.cert .mid { display:flex; align-items:center; justify-content:center; gap:30px; flex-wrap:wrap; margin:6px 0 16px; }
.ring { width:150px; height:150px; position:relative; }
.ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.ring circle { fill:none; stroke-width:12; }
.ring .tr { stroke:var(--tint); } .ring .vl { stroke:url(#rg); stroke-linecap:round; transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1); }
.ring b { position:absolute; inset:0; display:grid; place-items:center; align-content:center; font:800 44px/1 var(--head); color:var(--navy); }
.ring b small { display:block; font:600 13px var(--sans); color:var(--muted); margin-top:4px; }
.rank { text-align:left; }
.rank .badge { display:inline-flex; align-items:center; gap:8px; font:800 22px var(--head); color:var(--navy); }
.rank .badge svg { width:30px; height:30px; color:var(--gold); }
.rank p { margin:4px 0 0; color:var(--muted); }
.rank .pts { font:800 18px var(--head); color:var(--blue); margin-top:8px; }
.medals { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:6px 0 18px; }
.md { padding:12px 10px; border-radius:16px; background:var(--tint2); border:1px solid var(--line); }
.md svg { width:44px; height:44px; }
.md b { display:block; font:700 13px var(--head); color:var(--ink); }
.md small { color:var(--muted); font-size:12.5px; }
.sig { display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-top:10px; padding-top:16px; border-top:1px dashed var(--line); color:var(--muted); font-size:13px; text-align:left; }
.sig b { display:block; color:var(--ink); font:700 14px var(--head); }
.actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.btn2 { border:1px solid #ffffff2e; background:#ffffff12; color:#fff; border-radius:12px; padding:11px 18px; font:700 14px var(--sans); cursor:pointer; display:inline-flex; gap:8px; align-items:center; }
.btn2:hover { background:#ffffff22; }
.review { background:#ffffff0b; border:1px solid #ffffff1a; border-radius:22px; padding:18px 20px; }
.review h3 { margin:0 0 10px; font:800 18px var(--head); }
.rv { background:#fff; color:var(--ink); border-radius:14px; padding:14px 16px; margin-top:10px; }
.rv .rq { font-weight:700; }
.rv .ra { color:var(--ok2); font-weight:600; margin-top:6px; }
.rv .rx { color:var(--body); font-size:14px; margin-top:4px; }
.perfect { text-align:center; color:#C9D8F5; }
.place:empty { display:none; }
.place { display:flex; align-items:center; justify-content:center; gap:10px; font:600 17px var(--sans); color:#DCE7FF; }
.place svg { width:24px; height:24px; color:var(--gold); } .place b { color:var(--gold); font:800 22px var(--head); }
a.btn2 { text-decoration:none; } .btn2 svg { width:18px; height:18px; }
canvas#cf { position:fixed; inset:0; pointer-events:none; z-index:30; }
footer { text-align:center; color:#8FA8D8; font-size:12.5px; margin-top:26px; }
@media (max-width:920px) { .land { grid-template-columns:1fr; min-height:0; } .play { grid-template-columns:1fr; } .rail { position:static; } .opts { grid-template-columns:1fr; } .medals { grid-template-columns:1fr 1fr; } }
@media print {
  body { background:#fff !important; } body::before, body::after, .bar, .actions, .place, .review, footer, canvas { display:none !important; }
  .app { padding:0; } .cert { box-shadow:none; } .cert::after { display:none; }
}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00AEFF"/><stop offset="1" stop-color="#0573FF"/></linearGradient></defs></svg>
<div class="app">
  <div class="bar"><img src="/logo.png" alt="QoreBox"><span class="sep"></span><div class="ttl"><b id="qtitle">Docker Quiz</b><small>Jaiz Microservices Training</small></div><div class="chips" id="chips"></div></div>
  <main id="app"></main>
  <footer>Jaiz Microservices Training · Abubakar Bello &amp; Nasir Musa Imam · QoreBox</footer>
</div>
<script src="/quiz-docker.js"></script>
<script src="/quiz-platform.js"></script>
<script>
// Which quiz? "/platform" runs the platform quiz; anything else runs the Docker quiz.
const QUIZ_ID = location.pathname.replace(/\/+$/, "").endsWith("/platform") ? "platform" : "docker";
const QZ = window.QUIZZES[QUIZ_ID];
const LEVELS = QZ.levels, Q = QZ.questions;
document.title = `${QZ.title} · QoreBox`;
document.getElementById("qtitle").textContent = QZ.title;
const KEY = QUIZ_ID === "docker" ? "qorebox.dockerquiz.v2" : `qorebox.${QUIZ_ID}quiz.v1`;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const right = q => +atob(q.k) - 7;
const WORTH = [100, 200, 300, 400];
const ICON = {
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>',
  fire: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3 1-6 1-8.5z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 21h8M10 17h4v4h-4z"/></svg>',
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
};
let S = load() || fresh("");
function fresh(name) { return { name, i: 0, picks: [], pts: [], streak: 0, best: 0, started: null, finished: null, order: null }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { } }
// ---------- shared leaderboard ----------
const PID = (() => { const k = "qorebox.dockerquiz.pid"; let v; try { v = localStorage.getItem(k); } catch { }
  if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12)); try { localStorage.setItem(k, v); } catch { } } return v; })();
function sync() {
  if (!S.name || !S.started) return Promise.resolve();
  return fetch("/api/score", { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
    body: JSON.stringify({ quiz: QUIZ_ID, id: PID, name: S.name, points: points(), correct: correct(), answered: S.picks.filter(x => x !== undefined).length, best: S.best, started: S.started, finished: S.finished }) }).catch(() => { });
}
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function shuffleAll() { return Q.map(q => { const a = q.o.map((_, i) => i); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }); }
const ord = i => (S.order && S.order[i]) || Q[i].o.map((_, k) => k);
const isRight = i => S.picks[i] !== undefined && S.picks[i] === right(Q[i]);
const correct = lv => Q.reduce((n, q, i) => n + ((lv === undefined || q.l === lv) && isRight(i) ? 1 : 0), 0);
const points = () => S.pts.reduce((a, b) => a + (b || 0), 0);
const maxPoints = Q.reduce((a, q) => a + WORTH[q.l], 0);

function chips(show) {
  $("#chips").innerHTML = show ? `<span class="chip pts">${ICON.star}<b>${points()}</b> pts</span><span class="chip fire">${ICON.fire}${S.streak} streak</span>` : "";
}

// ---------- landing ----------
function landing() {
  chips(false);
  const boxes = `<svg class="boxes" viewBox="0 0 320 150" aria-hidden="true">
    ${[0, 1, 2].map(k => `<g transform="translate(${20 + k * 98} ${k % 2 ? 40 : 60})"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="${3 + k * .6}s" repeatCount="indefinite"/>
      <rect width="86" height="64" rx="10" fill="${["#0573FF", "#00AEFF", "#3F51D9"][k]}"/>
      ${[0, 1, 2, 3, 4].map(s => `<rect x="${10 + s * 14}" y="10" width="7" height="44" rx="3" fill="#ffffff2e"/>`).join("")}
      <rect x="-4" y="-6" width="94" height="10" rx="5" fill="#ffffff55"/></g></g>`).join("")}
    <rect x="10" y="132" width="300" height="6" rx="3" fill="#ffffff22"/></svg>`;
  $("#app").innerHTML = `<section class="land">
    <div>
      <span class="eyebrow"><i></i>${QZ.eyebrow}</span>
      <h1>${QZ.heading[0]} <span>${QZ.heading[1]}</span></h1>
      <p class="lead">${QZ.lead}</p>
      <div class="facts"><div class="fact"><b>20</b><small>questions</small></div><div class="fact"><b>4</b><small>levels</small></div><div class="fact"><b>${QZ.minutes}</b><small>minutes</small></div><div class="fact"><b>${maxPoints}</b><small>points to win</small></div></div>
      <div class="namebox"><input id="name" maxlength="40" placeholder="Type your full name" value="${esc(S.name || "")}" autocomplete="name"><button class="go" id="go" ${S.name ? "" : "disabled"}>Start ${ICON.arrow}</button></div>
      <div class="hint">Your name goes on your certificate. Your score appears live on the class leaderboard. Your progress is saved if you refresh.</div>
    </div>
    <div>
      ${boxes}
      <div class="path">${LEVELS.map((L, i) => `<div class="stop" style="--c:${L.c}"><span class="n">${i + 1}</span><div><b>${L.short}</b><small>5 questions · ${WORTH[i]} pts each</small></div><span class="diff">${[0, 1, 2, 3].map(d => `<i class="${d <= i ? "on" : ""}"></i>`).join("")}</span></div>`).join("")}</div>
    </div></section>`;
  const inp = $("#name"), go = $("#go");
  inp.oninput = () => { go.disabled = !inp.value.trim(); };
  inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) go.click(); };
  go.onclick = () => { S = fresh(inp.value.trim()); S.started = Date.now(); S.order = shuffleAll(); save(); question(); };
  inp.focus();
}

// ---------- question ----------
function rail(cur) {
  return `<aside class="rail"><h3>Your progress</h3>
    ${LEVELS.map((L, l) => `<div class="lvl ${Q[cur]?.l === l ? "cur" : ""}" style="--c:${L.c}"><div class="t">${L.short}<span>${correct(l)}/5</span></div>
      <div class="dots">${Q.map((q, i) => q.l !== l ? "" : `<i class="dot ${S.picks[i] === undefined ? (i === cur ? "now" : "") : isRight(i) ? "ok" : "no"}"></i>`).join("")}</div></div>`).join("")}
    <div class="stats"><div class="st"><b>${correct()}</b><small>correct</small></div><div class="st"><b>${S.best}</b><small>best streak</small></div></div>
    <div class="keys"><kbd>A</kbd>–<kbd>D</kbd> answer · <kbd>Enter</kbd> next</div></aside>`;
}
function question() {
  if (S.i >= Q.length) return certificate();
  chips(true);
  const q = Q[S.i], L = LEVELS[q.l];
  $("#app").innerHTML = `<section class="play">${rail(S.i)}
    <article class="qcard" style="--c:${L.c}">
      <div class="qhead"><span class="lv">${L.name}</span><span class="worth">${WORTH[q.l]} pts</span><span class="num">Question ${S.i + 1} / ${Q.length}</span></div>
      <div class="qbody">
        <p class="q">${q.q}</p>
        ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ""}
        <div class="opts">${ord(S.i).map((k, pos) => `<button class="opt" data-k="${k}" data-pos="${pos}"><span class="L">${"ABCD"[pos]}</span><span>${q.o[k]}</span></button>`).join("")}</div>
        <div id="fb"></div>
        <div class="foot" id="foot" hidden><span class="tip">Press <b>Enter</b> to continue</span><button class="next" id="next">${S.i + 1 === Q.length ? "See my certificate" : "Next question"} ${ICON.arrow}</button></div>
      </div></article></section>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = e => pick(+b.dataset.k, e));
  if (S.picks[S.i] !== undefined) reveal(S.picks[S.i], false);
}
function pick(k, e) {
  if (S.picks[S.i] !== undefined) return;
  const q = Q[S.i], ok = k === right(q);
  S.picks[S.i] = k;
  if (ok) { S.streak++; S.best = Math.max(S.best, S.streak); S.pts[S.i] = WORTH[q.l] + (S.streak >= 3 ? 50 : 0); }
  else { S.streak = 0; S.pts[S.i] = 0; }
  save(); sync();
  reveal(k, true, e);
}
function reveal(k, fresh, e) {
  const q = Q[S.i], r = right(q), ok = k === r;
  document.querySelectorAll(".opt").forEach(b => { const i = +b.dataset.k; b.disabled = true;
    if (i === r) { b.classList.add("right"); b.insertAdjacentHTML("beforeend", `<span class="mk">${ICON.check}</span>`); }
    else if (i === k) { b.classList.add("wrong"); b.insertAdjacentHTML("beforeend", `<span class="mk">${ICON.x}</span>`); }
    else b.classList.add("dim"); });
  $("#fb").innerHTML = `<div class="why ${ok ? "" : "no"}"><span class="ic">${ok ? ICON.check : ICON.x}</span><div><h4>${ok ? (S.streak >= 3 && fresh ? `Correct! ${S.streak} in a row` : "Correct!") : "Not quite"}</h4><p>${q.w}</p></div></div>`;
  $("#foot").hidden = false;
  $("#next").onclick = next;
  if (fresh) {
    chips(true);
    document.querySelector(".rail").outerHTML = rail(S.i);
    if (ok) { const p = document.createElement("div"); p.className = "pop"; p.textContent = `+${S.pts[S.i]}`;
      const src = e?.currentTarget?.getBoundingClientRect?.() || { left: innerWidth / 2, top: innerHeight / 2, width: 0 };
      p.style.left = (src.left + src.width / 2 - 40) + "px"; p.style.top = (src.top - 10) + "px"; document.body.appendChild(p); setTimeout(() => p.remove(), 1200); }
  }
}
function next() {
  const was = Q[S.i].l; S.i++; save();
  if (S.i < Q.length && Q[S.i].l !== was) return levelUp(was);
  question();
}
function medal(color, n, size = 160) {
  return `<svg class="medal" viewBox="0 0 160 160" width="${size}" height="${size}" aria-hidden="true">
    <path d="M52 8h20l14 40H66zM108 8H88L74 48h20z" fill="${color}" opacity=".55"/>
    <circle cx="80" cy="98" r="52" fill="${color}"/><circle cx="80" cy="98" r="40" fill="none" stroke="#ffffff66" stroke-width="3" stroke-dasharray="4 6"/>
    <text x="80" y="114" text-anchor="middle" font-family="Plus Jakarta Sans, Arial" font-weight="800" font-size="46" fill="#fff">${n}</text></svg>`;
}
function levelUp(done) {
  chips(true);
  const got = correct(done), L = LEVELS[done], N = LEVELS[done + 1];
  const col = got === 5 ? "#FFC94D" : got >= 4 ? "#C9D3E3" : got >= 3 ? "#D99158" : "#5B6880";
  $("#app").innerHTML = `<section class="levelup">${medal(col, done + 1)}
    <span class="eyebrow"><i></i>Level ${done + 1} complete</span>
    <h2>${got} of 5 in ${L.short}</h2>
    <p>Next: <b>Level ${done + 2} · ${N.short}</b>. Questions now give ${WORTH[done + 1]} points each.</p>
    <button class="go" id="go">Start level ${done + 2} ${ICON.arrow}</button></section>`;
  $("#go").onclick = question; $("#go").focus();
}

// ---------- certificate ----------
function certificate() {
  chips(true);
  if (!S.finished) { S.finished = Date.now(); save(); }
  sync().then(showPlace);
  const n = correct(), C = 2 * Math.PI * 62, pts = points();
  const R = QZ.ranks, rank = n === 20 ? R[0] : n >= 17 ? R[1] : n >= 13 ? R[2] : n >= 9 ? R[3] : R[4];
  const mins = Math.max(1, Math.round((S.finished - (S.started || S.finished)) / 60000));
  const medalColor = g => g === 5 ? "#FFC94D" : g >= 4 ? "#C9D3E3" : g >= 3 ? "#D99158" : "#DDE5F0";
  const missed = Q.map((q, i) => ({ q, i })).filter(({ i }) => !isRight(i));
  $("#app").innerHTML = `<section class="done">
    <article class="cert" id="cert">
      <img class="logo" src="/logo.png" alt="QoreBox">
      <div class="k">Certificate of completion · ${QZ.certificate}</div>
      <div class="who">${esc(S.name)}</div>
      <p class="what">${QZ.what}</p>
      <div class="mid">
        <div class="ring"><svg viewBox="0 0 150 150"><circle class="tr" cx="75" cy="75" r="62"/><circle class="vl" id="rv" cx="75" cy="75" r="62" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><b>${n}<small>out of 20</small></b></div>
        <div class="rank"><span class="badge">${ICON.trophy}${rank[0]}</span><p>${rank[1]}</p><div class="pts">${pts} / ${maxPoints} points · best streak ${S.best}</div></div>
      </div>
      <div class="medals">${LEVELS.map((L, l) => { const g = correct(l); return `<div class="md">${medal(medalColor(g), l + 1, 44)}<b>${L.short}</b><small>${g} of 5</small></div>`; }).join("")}</div>
      <div class="sig"><div><b>Abubakar Bello &amp; Nasir Musa Imam</b>Trainers, QoreBox</div><div style="text-align:right"><b>${new Date(S.finished).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" })}</b>completed in ${mins} min</div></div>
    </article>
    <div class="place" id="place"></div>
    <div class="actions"><a class="btn2" href="/leaderboard?quiz=${QUIZ_ID}" target="_blank">${ICON.trophy}Leaderboard</a><button class="btn2" id="print">${ICON.print}Print or save as PDF</button><button class="btn2" id="again">${ICON.redo}Try again</button></div>
    ${missed.length ? `<section class="review"><h3>Learn from the ${missed.length} you missed</h3>${missed.map(({ q, i }) => `<div class="rv"><div class="rq">${i + 1}. ${q.q}</div><div class="ra">Right answer: ${q.o[right(q)]}</div><div class="rx">${q.w}</div></div>`).join("")}</section>` : `<p class="perfect">Perfect score. Nothing to review!</p>`}
  </section>`;
  setTimeout(() => { const r = $("#rv"); if (r) r.style.strokeDashoffset = C * (1 - n / 20); }, 120);
  $("#print").onclick = () => window.print();
  $("#again").onclick = () => { if (confirm("Start again? Your answers will be cleared.")) { S = fresh(S.name); save(); landing(); } };
  if (n >= 13) confetti();
}
function showPlace() {
  fetch(`/api/leaderboard?quiz=${QUIZ_ID}`, { cache: "no-store" }).then(r => r.json()).then(rows => {
    const me = rows.find(r => r.id === PID), el = $("#place"); if (!me || !el) return;
    el.innerHTML = `${ICON.trophy}<span>You are <b>#${me.pos}</b> of ${rows.length} on the leaderboard${me.points !== points() ? ` with ${me.points} pts (your first full attempt counts)` : ""}</span>`;
  }).catch(() => { });
}
function confetti() {
  const cv = $("#cf"), cx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#0573FF", "#00AEFF", "#3F51D9", "#FFC94D", "#12B574", "#ffffff"];
  const P = Array.from({ length: 200 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height, r: 3 + Math.random() * 5, c: cols[Math.random() * cols.length | 0], vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, a: Math.random() * 6 }));
  let t = 0; (function f() { cx.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.y += p.vy; p.x += p.vx + Math.sin((t + p.a) / 12); cx.fillStyle = p.c; cx.save(); cx.translate(p.x, p.y); cx.rotate(t / 10 + p.a); cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
    if (++t < 380) requestAnimationFrame(f); else cx.clearRect(0, 0, cv.width, cv.height); })();
}

// keyboard: A-D (or 1-4) to answer, Enter for next
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const card = document.querySelector(".qcard");
  if (card) {
    const pos = "abcd".indexOf(e.key.toLowerCase()) >= 0 ? "abcd".indexOf(e.key.toLowerCase()) : "1234".indexOf(e.key);
    if (pos >= 0 && S.picks[S.i] === undefined) { const b = document.querySelector(`.opt[data-pos="${pos}"]`); if (b) b.click(); return; }
    if (e.key === "Enter" && S.picks[S.i] !== undefined) { e.preventDefault(); next(); return; }
  }
  if (e.key === "Enter" && document.querySelector(".levelup")) { e.preventDefault(); question(); }
});

// resume where the participant was
if (S.finished) certificate(); else if (S.started) question(); else landing();
</script>
</body>
</html>
